searchd {
  listen = 9306:mysql
  listen = 9308:http
  log = /var/log/manticore/searchd.log
  query_log = /var/log/manticore/query.log
  pid_file = /var/run/manticore/searchd.pid
}

table aanvragen {
  type = rt
  # Path bumped to aanvragen_v2 (table name unchanged) for the document_id
  # column added below. manticore_data is a persisted named volume and RT
  # tables ignore conf schema changes on an existing path — an old volume
  # would hit "unknown column: document_id" on /replace. Nothing was ever
  # indexed successfully at the old path (RJC-356), so there is no data to
  # migrate; a fresh path is the safe, data-loss-free fix. Do not run
  # `docker compose down -v` to force a reset (BUILD_BRIEF forbids it).
  path = /var/lib/manticore/aanvragen_v2
  rt_field = titel
  rt_field = beschrijving
  rt_field = opdrachtgever_naam
  rt_attr_string = bron_id
  rt_attr_string = status
  rt_attr_string = locatie_land
  rt_attr_string = contracttype
  # Manticore's own document id (the top-level "id") must be a bigint, but
  # SearchDocument.id is a string (UUID in production). document_id stores
  # the real string id so search hits can report it back; the numeric
  # Manticore id is a deterministic hash of document_id (see
  # packages/search/src/manticore/id-hash.ts).
  rt_attr_string = document_id
  # v4: canonical source projection fingerprint, used only by reconciliation
  # to prove the physical RT row matches Postgres projection state.
  rt_attr_string = projection_hash
  rt_attr_float = tarief_min
  rt_attr_float = tarief_max
  rt_attr_timestamp = laatst_gezien_op
  rt_attr_bigint = index_version
  # RJC-378: server-side location facet/filter and closing-soon sort. Both
  # attributes are additive; an EXISTING volume does not pick them up from
  # this conf (see the path note above) — run
  #   ALTER TABLE aanvragen ADD COLUMN locatie string;
  #   ALTER TABLE aanvragen ADD COLUMN sluitingsdatum timestamp;
  # then `bun run search:new-generation` (SEARCH_SCHEMA_HASH changed) and
  # reindex so the columns are populated. Full runbook:
  # docs/runbooks/search-schema-migration.md. Missing deadlines are stored as
  # the sentinel 4102444800 (2100-01-01) so `sluitingsdatum asc` sorts them
  # last; see packages/search/src/manticore/engine.ts.
  rt_attr_string = locatie
  rt_attr_timestamp = sluitingsdatum
  rt_attr_string = opdrachtgever_naam
  rt_attr_string = opdrachtgever_naam_keyword
  rt_attr_string = provincie
  # Skills are string arrays, so JSON is used; native MVA only stores integers.
  rt_attr_json = skills
  rt_attr_timestamp = publicatiedatum
  rt_attr_string = tarief_eenheid
  rt_attr_float = uren_per_week_min
  rt_attr_float = uren_per_week_max
  rt_attr_string = werkvorm
  rt_attr_float = comparable_tarief
  rt_attr_string = titel_keyword
  # stem_en is Porter; Dutch uses libstemmer_nl (there is no stem_nl in stock 6.3.8).
  morphology = stem_en, libstemmer_nl
  html_strip = 1
  rt_mem_limit = 128M
}

# RJC-383: the search index is split into two partitions with the SAME
# schema as `aanvragen` above (see that block for the per-column rationale):
#   aanvragen_active  — the placeable stock: open records (status active /
#                       unknown) whose sluitingsdatum has not passed
#   aanvragen_archive — closed / stale / expired records
# The projector routes every document by packages/search/src/partition.ts
# and MOVES it between the two tables when its lifecycle changes; search
# reads `aanvragen_active` by default and `aanvragen_active,aanvragen_archive`
# for scope=all. The legacy single `aanvragen` table stays readable until the
# operator drops it (docs/runbooks/search-schema-migration.md) — nothing here
# is destructive. Fresh paths: an existing volume only picks these tables up
# from this conf because they are NEW tables (RT tables ignore conf schema
# changes on an existing path, never conf-level additions of tables).

table aanvragen_active {
  type = rt
  path = /var/lib/manticore/aanvragen_active
  rt_field = titel
  rt_field = beschrijving
  rt_field = opdrachtgever_naam
  rt_attr_string = bron_id
  rt_attr_string = status
  rt_attr_string = locatie_land
  rt_attr_string = contracttype
  rt_attr_string = document_id
  rt_attr_string = projection_hash
  rt_attr_float = tarief_min
  rt_attr_float = tarief_max
  rt_attr_timestamp = laatst_gezien_op
  rt_attr_bigint = index_version
  rt_attr_string = locatie
  rt_attr_timestamp = sluitingsdatum
  rt_attr_string = opdrachtgever_naam
  rt_attr_string = opdrachtgever_naam_keyword
  rt_attr_string = provincie
  rt_attr_json = skills
  rt_attr_timestamp = publicatiedatum
  rt_attr_string = tarief_eenheid
  rt_attr_float = uren_per_week_min
  rt_attr_float = uren_per_week_max
  rt_attr_string = werkvorm
  rt_attr_float = comparable_tarief
  rt_attr_string = titel_keyword
  morphology = stem_en, libstemmer_nl
  html_strip = 1
  rt_mem_limit = 128M
}

