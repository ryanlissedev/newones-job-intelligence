---
# Lefthook — sole owner of `.git/hooks` (never run `qlty githooks install`).
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  jobs:
    - name: wiki-guard
      run: bash tools/quality/guard-wiki-commit.sh
    - name: ultracite
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,yml,yaml}"
      exclude:
        - docs/**
        - openwiki/**
        - .cursor/skills/verify-job-intelligence/**
        - .cursor/skills/verify-job-intelligence/**
      run: bash tools/quality/fix-staged.sh {staged_files}
      stage_fixed: true
    - name: qlty
      glob:
        - "*.{yml,yaml,sh}"
        - ".github/**"
      exclude:
        - docs/**
        - openwiki/**
      run: bash tools/quality/qlty-staged.sh {staged_files}

pre-push:
  jobs:
    # A script job, not a command job: lefthook skips command jobs with
    # "no matching push files" when the push list is empty, and it builds that
    # list without deletions, so a deletion-only push landed ungated (CTP-503).
    - name: gate
      script: gate.sh
      runner: bash
