---
# Evidence-only workflow for the 2026-10-09 quick-fix PRs. It lives on the
# evidence/2026-10-09-quick-fixes branch only (never merged) and compares a
# production build of main against the PR3 head with Lighthouse mobile.
name: PR3 Lighthouse evidence

"on":
  push:
    branches:
      - evidence/2026-10-09-quick-fixes
    paths:
      - ".github/workflows/pr3-lighthouse-evidence.yml"
      - ".evidence/2026-10-09-quick-fixes/lighthouse/*.ts"
      - ".evidence/2026-10-09-quick-fixes/lighthouse/refs.env"

permissions:
  contents: read

concurrency:
  group: pr3-lighthouse-evidence
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse mobile before/after
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out evidence harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          path: evidence

      - name: Read refs
        id: refs
        run: cat evidence/.evidence/2026-10-09-quick-fixes/lighthouse/refs.env >> "$GITHUB_OUTPUT"

      - name: Check out base (main)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ steps.refs.outputs.BASE_SHA }}
          path: base

      - name: Check out head (PR3)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ steps.refs.outputs.HEAD_SHA }}
          path: head

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.14

      - name: Install and build both variants
        env:
          NEXT_PUBLIC_SERVER_URL: http://localhost:3100
          NEXT_PUBLIC_USE_FIXTURES: "0"
        run: |
          set -euo pipefail
          for variant in base head; do
            (cd "${variant}" && bun install --frozen-lockfile)
            (cd "${variant}/apps/web" && bun run build)
          done

      - name: Install Chromium for screenshots and e2e
        working-directory: head
        run: bunx playwright install --with-deps chromium

      - name: Measure
        env:
          NEXT_PUBLIC_SERVER_URL: http://localhost:3100
          NEXT_PUBLIC_USE_FIXTURES: "0"
          PORT: "3001"
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/out"
          # Copied into the head checkout so imports resolve against its node_modules.
          harness="${GITHUB_WORKSPACE}/head/.lighthouse-harness"
          cp -r "${GITHUB_WORKSPACE}/evidence/.evidence/2026-10-09-quick-fixes/lighthouse" "${harness}"
          mkdir -p "${out}/lh" "${out}/shots" "${out}/e2e"
          PORT=3100 bun "${harness}/slow-session-api.ts" > "${out}/api.log" 2>&1 &
          api_pid=$!
          trap 'kill ${api_pid} 2>/dev/null || true' EXIT
          for variant in base head; do
            (cd "${variant}/apps/web" && exec ./node_modules/.bin/next start) > "${out}/web-${variant}.log" 2>&1 &
            web_pid=$!
            for attempt in $(seq 1 60); do
              if curl --fail --silent http://localhost:3001/login >/dev/null; then break; fi
              if [ "${attempt}" -eq 60 ]; then cat "${out}/web-${variant}.log"; exit 1; fi
              sleep 1
            done
            # Warm the server so the first measured run is not a cold start.
            curl --silent http://localhost:3001/jobs >/dev/null
            curl --silent http://localhost:3001/login >/dev/null
            for page in jobs login; do
              for run in 1 2 3 4 5; do
                npx --yes lighthouse@12.8.2 "http://localhost:3001/${page}" \
                  --only-categories=performance \
                  --throttling-method=devtools \
                  --output=json --output=html \
                  --output-path="${out}/lh/${variant}-${page}-${run}" \
                  --chrome-flags="--headless=new --no-sandbox" --quiet
              done
            done
            (cd head && bun "${harness}/capture.ts" "${variant}" "${out}/shots")
            if [ "${variant}" = head ]; then
              (cd head && E2E_LIVE_WEB_URL=http://localhost:3001 \
                ./node_modules/.bin/e2e run --config e2e.live.config.ts \
                tests/live/job-search.e2e.ts tests/live/login.e2e.ts tests/live/home.e2e.ts) \
                > "${out}/e2e/head-e2e.txt" 2>&1 || echo "e2e exit $?" >> "${out}/e2e/head-e2e.txt"
              cat "${out}/e2e/head-e2e.txt"
              cp -r head/.e2e "${out}/e2e/report" 2>/dev/null || true
            fi
            kill "${web_pid}"
            wait "${web_pid}" 2>/dev/null || true
          done
          (cd head && bun "${harness}/summarize.ts" "${out}/lh") | tee "${out}/summary.md"
          cat "${out}/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pr3-lighthouse-evidence
          path: out/**
          retention-days: 30
