---
name: Deploy production

"on":
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read
  checks: read
  deployments: write
  issues: read
  pull-requests: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
    env:
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PRODUCTION_LAST_DEPLOYED_RELEASE_JSON: ${{ vars.PRODUCTION_LAST_DEPLOYED_RELEASE_JSON }}
      COOLIFY_DEPLOY_DEADLINE_MS: 1800000
      COOLIFY_DEPLOY_ROLLBACK_RESERVE_MS: 600000
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.14

      - name: Run fail-closed release gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_GATE_EVIDENCE_FILE: ${{ runner.temp }}/release-gate.json
          RELEASE_GATE_REVIEW_MODE: ${{ vars.RELEASE_GATE_REVIEW_MODE }}
        run: |
          set -euo pipefail
          bun scripts/production/release-gate.ts > "${RELEASE_GATE_EVIDENCE_FILE}"
          jq -e --arg sha "${CANDIDATE_SHA}" '.result == "pass" and .candidateSha == $sha' "${RELEASE_GATE_EVIDENCE_FILE}" >/dev/null

      - name: Acquire production deployment lease
        id: ledger
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ledger_payload='(.payload | if type=="string" then (try fromjson catch {}) else . end)'
          ledger_jq=".[] | select((${ledger_payload} | .candidate_sha?) as \$c"
          ledger_jq="${ledger_jq} | (\$c | type) == \"string\" and (.sha == null or .sha == \$c)) | .id"
          mapfile -t active_ids < <(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/deployments?environment=production&per_page=100" \
            --jq "${ledger_jq}")
          for active_id in "${active_ids[@]}"; do
            state="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/deployments/${active_id}/statuses?per_page=1" \
              --jq '.[0].state // "unknown"')"
            case "${state}" in
              in_progress|queued|pending)
                echo "production deployment lease is held by deployment ${active_id}" >&2
                exit 1
                ;;
              unknown)
                echo "production deployment ${active_id} has no readable terminal status" >&2
                exit 1
                ;;
            esac
          done
          metadata="$(jq -cn \
            --arg workflow "${GITHUB_WORKFLOW}" \
            --arg workflowRunId "${GITHUB_RUN_ID}" \
            --arg runAttempt "${GITHUB_RUN_ATTEMPT}" \
            --arg job "deploy" \
            --arg sha "${CANDIDATE_SHA}" \
            '{workflow:$workflow,workflow_run_id:$workflowRunId,run_attempt:$runAttempt,job:$job,candidate_sha:$sha}')"
          description="Automatic production release ${CANDIDATE_SHA}"
          description+=" workflow=${GITHUB_WORKFLOW} run=${GITHUB_RUN_ID}"
          description+=" attempt=${GITHUB_RUN_ATTEMPT} job=deploy"
          # A JSON body: `-F required_contexts='[]'` sends the string "[]" and the
          # API answers 422 ("is not an array or null").
          deployment_body="$(jq -cn \
            --arg ref "${CANDIDATE_SHA}" \
            --arg description "${description}" \
            --argjson payload "${metadata}" \
            '{ref:$ref,environment:"production",description:$description,payload:$payload,auto_merge:false,required_contexts:[]}')"
          deployment_id="$(printf '%s' "${deployment_body}" | gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/deployments" \
            --input - | jq -er '.id')"
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
            -f state=in_progress \
            -f description="Coolify release ledger acquired for ${CANDIDATE_SHA}" \
            >/dev/null
          echo "deployment_id=${deployment_id}" >> "${GITHUB_OUTPUT}"

      - name: Validate Tailscale deploy configuration
        if: ${{ vars.PRODUCTION_DEPLOY_TAILSCALE_ENABLED == '1' }}
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          COOLIFY_SSH_TAILSCALE_HOST: ${{ vars.COOLIFY_SSH_TAILSCALE_HOST }}
          COOLIFY_SSH_TAILSCALE_KNOWN_HOSTS: ${{ vars.COOLIFY_SSH_TAILSCALE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for required_name in \
            TS_OAUTH_CLIENT_ID \
            TS_OAUTH_SECRET \
            COOLIFY_SSH_TAILSCALE_HOST \
            COOLIFY_SSH_TAILSCALE_KNOWN_HOSTS; do
            if [[ -z "${!required_name}" ]]; then
              echo "::error::Missing required Tailscale deployment configuration: ${required_name}"
              exit 1
            fi
          done

      - name: Join production tailnet
        if: ${{ vars.PRODUCTION_DEPLOY_TAILSCALE_ENABLED == '1' }}
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888  # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:catapulze-deploy
          ping: ${{ vars.COOLIFY_SSH_TAILSCALE_HOST }}

      - name: Deploy server, web, and projector sequentially
        id: deploy
        continue-on-error: true
        env:
          COOLIFY_PROJECTOR_APPLICATION_UUID: ${{ vars.COOLIFY_PROJECTOR_APPLICATION_UUID }}
          COOLIFY_SERVER_APPLICATION_UUID: ${{ vars.COOLIFY_SERVER_APPLICATION_UUID }}
          COOLIFY_WEB_APPLICATION_UUID: ${{ vars.COOLIFY_WEB_APPLICATION_UUID }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_SSH_HOST: >-
            ${{ vars.PRODUCTION_DEPLOY_TAILSCALE_ENABLED == '1' &&
            vars.COOLIFY_SSH_TAILSCALE_HOST || vars.COOLIFY_SSH_HOST }}
          COOLIFY_SSH_KNOWN_HOSTS: >-
            ${{ vars.PRODUCTION_DEPLOY_TAILSCALE_ENABLED == '1' &&
            vars.COOLIFY_SSH_TAILSCALE_KNOWN_HOSTS || vars.COOLIFY_SSH_KNOWN_HOSTS }}
          COOLIFY_SSH_PORT: ${{ vars.COOLIFY_SSH_PORT }}
          COOLIFY_SSH_USER: ${{ vars.COOLIFY_SSH_USER }}
          COOLIFY_SSH_PRIVATE_KEY: ${{ secrets.COOLIFY_SSH_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          PRODUCTION_PROJECTOR_SCHEMA_HASH: ${{ vars.PRODUCTION_PROJECTOR_SCHEMA_HASH }}
          PRODUCTION_PROJECTOR_RUNTIME_URL: ${{ vars.PRODUCTION_PROJECTOR_RUNTIME_URL }}
          PRODUCTION_WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
          PRODUCTION_WEB_VERSION_URL: ${{ vars.PRODUCTION_WEB_VERSION_URL }}
          RELEASE_GATE_EVIDENCE_FILE: ${{ runner.temp }}/release-gate.json
          PRODUCTION_DEPLOYMENT_ID: ${{ steps.ledger.outputs.deployment_id }}
          PRODUCTION_DEPLOY_OUTCOME_FILE: ${{ runner.temp }}/production-deploy-outcome.json
        run: bun scripts/production/ssh-tunnel.ts -- bun scripts/production/coolify-deploy.ts

      - name: Finalize production deployment ledger
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.ledger.outputs.deployment_id }}
          OUTCOME_FILE: ${{ runner.temp }}/production-deploy-outcome.json
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOYMENT_ID}" ]]; then
            echo 'production deployment ledger was never acquired' >&2
            exit 1
          fi
          state=failure
          description='Coolify deployment failed; inspect the sanitized driver reason and rollback evidence'
          if [[ -f "${OUTCOME_FILE}" ]]; then
            state="$(jq -er '.state' "${OUTCOME_FILE}")"
            description="Coolify driver outcome $(jq -er '.code // .state' "${OUTCOME_FILE}")"
          elif [[ "${{ steps.deploy.outcome }}" == 'success' ]]; then
            state=success
            description='Coolify readback and public health checks passed'
          fi
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state="${state}" \
            -f description="${description}" \
            >/dev/null
          printf 'production deployment ledger finalized as %s for %s\n' "${state}" "${CANDIDATE_SHA}"
          if [[ "${state}" != 'success' ]]; then
            exit 1
          fi
          if [[ ! -f "${OUTCOME_FILE}" ]]; then
            echo 'production deploy outcome file is missing; baseline not rotated' >&2
            exit 1
          fi

      # GITHUB_TOKEN cannot write Actions variables at any permission level
      # (run 37431986942 got HTTP 403 here), so rotation uses a dedicated
      # fine-grained token that can only write this repository's variables.
      - name: Rotate production release baseline
        env:
          GH_TOKEN: ${{ secrets.PRODUCTION_VARIABLES_TOKEN }}
          OUTCOME_FILE: ${{ runner.temp }}/production-deploy-outcome.json
        run: |
          set -euo pipefail
          baseline="$(jq -ce '.nextReleaseBaseline' "${OUTCOME_FILE}")"
          # The baseline holds only SHAs and the ledger id. Recording it in the
          # summary lets an operator rotate by hand from this run's own output.
          {
            echo '### Next release baseline'
            echo
            echo '```json'
            printf '%s\n' "${baseline}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ -z "${GH_TOKEN}" ]]; then
            printf '::error::%s %s\n' \
              'PRODUCTION_VARIABLES_TOKEN is not set: the deployment succeeded but the baseline was not rotated.' \
              'Set PRODUCTION_LAST_DEPLOYED_RELEASE_JSON (production environment) to the JSON in this run summary.'
            exit 1
          fi
          variables_path="/repos/${GITHUB_REPOSITORY}/environments/production/variables"
          patch_error="$(mktemp)"
          trap 'rm -f "${patch_error}"' EXIT
          if ! gh api --method PATCH \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${variables_path}/PRODUCTION_LAST_DEPLOYED_RELEASE_JSON" \
            -f name=PRODUCTION_LAST_DEPLOYED_RELEASE_JSON \
            -f value="${baseline}" >/dev/null 2>"${patch_error}"; then
            if ! grep -q 'HTTP 404' "${patch_error}"; then
              cat "${patch_error}" >&2
              exit 1
            fi
            gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${variables_path}" \
              -f name=PRODUCTION_LAST_DEPLOYED_RELEASE_JSON \
              -f value="${baseline}" >/dev/null
          fi
          printf 'production release baseline rotated to %s\n' "${CANDIDATE_SHA}"
