---
name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 2

      - name: Detect code changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        id: filter
        with:
          filters: |
            code:
              - ".github/workflows/**"
              - ".dockerignore"
              - "package.json"
              - "bun.lock"
              - "turbo.json"
              - "apps/**"
              - "benchmarks/**"
              - "e2e/**"
              - "packages/**"
              - "playwright.live*.ts"
              - "tests/**"
              - "scripts/**"
              - "tools/**"
              - "**/*.spec.ts"
              - "docker-compose.yml"
              - "docker-compose*.yml"
              - ".qlty/**"
              - ".yamllint.yml"
              - "lefthook.yml"
              # Deployment-runbook changes must carry the full build, smoke,
              # and restore evidence required by the production release gate.
              - "docs/runbooks/automatic-production-deploy.md"

  # Never gate the test suite on paths: spec-only and dependency-only changes
  # must still produce a full gate duration and JUnit report. The changes
  # filter is reserved for the expensive build and restore-drill jobs below.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      # Pin turbo's local cache path so the actions/cache step above/below
      # always saves and restores the directory turbo actually writes.
      TURBO_CACHE_DIR: .turbo/cache
      PERF_ATTEMPT: ${{ github.run_attempt }}
      PERF_CONCURRENCY: "2"
      PERF_EXECUTOR: github-actions
      PERF_JOB: verify
      PERF_JUNIT_PATH: .artifacts/test-results/ci-junit.xml
      PERF_MACHINE: ubuntu-latest
      PERF_METRICS_DIR: .artifacts/performance/ci
      PERF_POSTGRES_IMAGE_DIGEST: sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
      PERF_POSTGRES_VERSION: "16"
      PERF_PROVIDER: github
      PERF_RUN_KIND: cold
      PERF_CACHE_STATE: unknown
      PERF_RUNNER: github-hosted
      PERF_TOOLCHAIN: Bun 1.3.14
      PERF_WORKFLOW: CI
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Use the Docker Hub pull-through mirror
        run: bash scripts/ci-docker-hub-mirror.sh

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: "1.3.14"

      - name: Pre-pull PostgreSQL image in the background
        run: |
          # Overlaps the image pull with the cache/install steps below; the
          # later `docker compose up --wait` finds the layers already local.
          nohup docker compose --env-file .env.example pull -q postgres \
            >/dev/null 2>&1 &

      - name: Restore Bun dependency cache
        id: bun-cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf  # v4.2.2
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Install Qlty
        uses: qltysh/qlty-action/install@08a0a862c159eae9b9003081da6663d96efef637  # v2.3.0

      - name: Restore Qlty cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf  # v4.2.2
        with:
          path: ~/.qlty
          key: qlty-${{ runner.os }}-${{ hashFiles('.qlty/qlty.toml') }}
          restore-keys: |
            qlty-${{ runner.os }}-

      - name: Restore Turborepo cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf  # v4.2.2
        with:
          path: .turbo/cache
          key: turbo-verify-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-verify-${{ runner.os }}-

      - name: Install locked dependencies
        env:
          PERF_CACHE_STATE: >-
            ${{ steps.bun-cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }}
          PERF_RUN_KIND: >-
            ${{ steps.bun-cache.outputs.cache-hit == 'true' && 'warm' || 'cold' }}
        run: bun scripts/performance/measure.ts --label install -- bun install --frozen-lockfile

      - name: Start isolated PostgreSQL
        env:
          POSTGRES_DATA_VOLUME: catapulze-postgres-ci
        run: |
          docker volume create "$POSTGRES_DATA_VOLUME"
          docker compose --env-file .env.example up -d --wait postgres

      - name: Verify
        run: bun scripts/performance/measure.ts --label gate -- bun run gate

      - name: Stop isolated PostgreSQL
        if: always()
        env:
          POSTGRES_DATA_VOLUME: catapulze-postgres-ci
        run: |
          # CI-only: destroy the ephemeral named volume. Production automation must
          # never run `docker compose down -v` against POSTGRES_DATA_VOLUME.
          docker compose --env-file .env.example down -v
          docker volume rm "$POSTGRES_DATA_VOLUME"

      - name: Report CI command timing
        if: always()
        run: bun scripts/performance/report.ts

      - name: Upload CI command timing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ci-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/performance/ci
            .artifacts/test-results
          if-no-files-found: warn
          retention-days: 7

  build:
    needs: changes
    # Compile proof only: nothing in verify consumes the build output, so it
    # runs in parallel instead of extending the critical path inside verify.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      # Pin turbo's local cache path so the actions/cache step above/below
      # always saves and restores the directory turbo actually writes.
      TURBO_CACHE_DIR: .turbo/cache
      PERF_ATTEMPT: ${{ github.run_attempt }}
      PERF_CONCURRENCY: "2"
      PERF_EXECUTOR: github-actions
      PERF_JOB: build
      PERF_MACHINE: ubuntu-latest
      PERF_METRICS_DIR: .artifacts/performance/ci
      PERF_PROVIDER: github
      PERF_RUN_KIND: cold
      PERF_CACHE_STATE: unknown
      PERF_RUNNER: github-hosted
      PERF_TOOLCHAIN: Bun 1.3.14
      PERF_WORKFLOW: CI
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: "1.3.14"

      - name: Restore Bun dependency cache
        id: bun-cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf  # v4.2.2
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Restore Turborepo cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf  # v4.2.2
        with:
          path: .turbo/cache
          key: turbo-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-build-${{ runner.os }}-

      - name: Install locked dependencies
        env:
          PERF_CACHE_STATE: >-
            ${{ steps.bun-cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }}
          PERF_RUN_KIND: >-
            ${{ steps.bun-cache.outputs.cache-hit == 'true' && 'warm' || 'cold' }}
        run: bun scripts/performance/measure.ts --label install -- bun install --frozen-lockfile

      - name: Build
        run: bun run build:timed

      - name: Report CI command timing
        if: always()
        run: bun scripts/performance/report.ts

      - name: Upload CI command timing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ci-performance-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/performance/ci
          if-no-files-found: warn
          retention-days: 7

  application-image-smoke:
    needs: changes
    # Thin main-push: full docker smoke only on PRs; main push keeps verify+build for Deploy.
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Required application-image proof. Four image builds plus disposable
    # services are bounded separately from the host build above.
    timeout-minutes: 30
    env:
      COMPOSE_PARALLEL_LIMIT: "2"
      # Disposable smoke contract: committed synthetic fixture (docker DNS +
      # non-secret placeholders). Do not use `.env` (gitignored) or bare
      # `.env.example` here — example URLs point at localhost and break
      # server↔web smoke. mcp-edge-smoke uses the same fixture path.
      COMPOSE_ENV_FILE: scripts/fixtures/docker-smoke.env
      # Host-side `bun run db:migrate` while Compose publishes Postgres on
      # 127.0.0.1:5432. Credentials match the fixture above (not secrets).
      MIGRATION_DATABASE_URL: postgresql://ji_migrator:ji_migrator_smoke@127.0.0.1:5432/ji_smoke
      # Server images set NODE_ENV=production and refuse the filesystem raw
      # store. Opt into the MinIO override (same synthetic values as the
      # crabbox / mcp-edge smoke lanes — not secrets).
      SMOKE_RAW_STORAGE: "1"
      RAW_S3_BUCKET: ji-raw-local
      RAW_S3_ENDPOINT: http://raw-storage-minio:9000
      RAW_S3_REGION: us-east-1
      RAW_S3_ACCESS_KEY_ID: minioadmin
      RAW_S3_SECRET_ACCESS_KEY: minioadmin
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Use the Docker Hub pull-through mirror
        run: bash scripts/ci-docker-hub-mirror.sh

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: "1.3.14"

      - name: Install locked dependencies
        # Host-side `bun -e` (volume name), `bun run db:migrate`, and the
        # Manticore live spec need the toolchain + lockfile install. Images
        # still build their own layers inside the smoke script.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build and smoke application images
        run: bash scripts/docker-compose-smoke.sh

      - name: Upload application-image smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: application-image-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/docker-smoke
          if-no-files-found: warn
          retention-days: 7

  mcp-edge-smoke:
    needs: changes
    # Thin main-push: skip on main push (Deploy only needs verify+build).
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PARALLEL_LIMIT: "2"
      MCP_EDGE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Use the Docker Hub pull-through mirror
        run: bash scripts/ci-docker-hub-mirror.sh

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: "1.3.14"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Type-check edge smoke harness
        run: bun run check-types:mcp-edge

      - name: Run stateless MCP edge smoke
        run: bun run docker:mcp-edge-smoke

      - name: Upload sanitized MCP edge evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: mcp-edge-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/mcp-edge-smoke
          if-no-files-found: warn
          retention-days: 7

  postgres-restore-drill:
    needs: changes
    # Thin main-push: restore drill is PR-only; weekly/ops can still run via re-run on a PR.
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Use the Docker Hub pull-through mirror
        run: bash scripts/ci-docker-hub-mirror.sh

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: "1.3.14"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run AE9 restore drill against MinIO fixture
        env:
          COMPOSE_ENV_FILE: .env.example
          POSTGRES_DATA_VOLUME: catapulze-postgres-restore-src
          POSTGRES_RESTORE_VOLUME: catapulze-postgres-restore-target
        run: bash tools/postgres/restore-drill.sh

      - name: Upload restore evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: postgres-restore-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/postgres-restore-evidence.json
          if-no-files-found: warn
          retention-days: 14
