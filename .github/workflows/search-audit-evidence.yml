---
name: Search audit evidence

"on":
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/search-audit-evidence.yml"
      - "apps/web/src/features/job-intelligence/**"
      - "e2e/search-audit/**"
      - "packages/application/src/registry/**"
      - "packages/search/src/**"

permissions:
  contents: read

concurrency:
  group: search-audit-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-evidence:
    name: Browser evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record evidence revision
        run: |
          mkdir -p .artifacts/e2e
          commit_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          printf 'commit=%s\ntree=%s\n' "${commit_sha}" "${tree_sha}" \
            > .artifacts/e2e/search-audit-revision.txt
          cat .artifacts/e2e/search-audit-revision.txt

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Install video encoder
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Type-check evidence harness
        run: ./node_modules/.bin/tsc --noEmit -p e2e/search-audit/tsconfig.json

      - name: Build web application
        env:
          NEXT_PUBLIC_SERVER_URL: http://localhost:3100
          NEXT_PUBLIC_USE_FIXTURES: "0"
        working-directory: apps/web
        run: bun run build

      - name: Run real REST adapter browser proof
        env:
          NEXT_PUBLIC_SERVER_URL: http://localhost:3100
          NEXT_PUBLIC_USE_FIXTURES: "0"
          PORT: "3001"
          SEARCH_AUDIT_E2E: "1"
        run: |
          set -euo pipefail
          bun e2e/search-audit/synthetic-api.ts > /tmp/search-audit-api.log 2>&1 &
          api_pid=$!
          (cd apps/web && exec ./node_modules/.bin/next start) > /tmp/search-audit-web.log 2>&1 &
          web_pid=$!
          cleanup() {
            kill "${web_pid}" "${api_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if ! kill -0 "${api_pid}" 2>/dev/null; then
              cat /tmp/search-audit-api.log
              exit 1
            fi
            if ! kill -0 "${web_pid}" 2>/dev/null; then
              cat /tmp/search-audit-web.log
              exit 1
            fi
            if curl --fail --silent http://localhost:3100/health >/dev/null && \
              curl --fail --silent http://localhost:3001/jobs >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              cat /tmp/search-audit-api.log
              cat /tmp/search-audit-web.log
              exit 1
            fi
            sleep 1
          done

          bunx playwright test --config=e2e/search-audit/playwright.config.ts
          find .artifacts/e2e/search-audit -name '*.webm' -print0 | while IFS= read -r -d '' clip; do
            ffmpeg -nostdin -i "${clip}" -c:v libx264 -preset medium -crf 23 \
              -pix_fmt yuv420p -movflags +faststart -threads 1 "${clip%.webm}.mp4"
          done

      - name: Show service logs after failure
        if: failure()
        run: |
          cat /tmp/search-audit-api.log 2>/dev/null || true
          cat /tmp/search-audit-web.log 2>/dev/null || true

      - name: Upload proof candidates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          if-no-files-found: error
          name: search-audit-browser-evidence-${{ github.sha }}
          path: |
            .artifacts/e2e/search-audit-revision.txt
            .artifacts/e2e/search-audit/**
            .artifacts/e2e/search-audit-report/**
          retention-days: 14
