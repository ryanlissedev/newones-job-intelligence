---
name: Bench Search

"on":
  # checkov:skip=CKV_GHA_7: documents is a bounded numeric corpus size, passed
  # through env (not interpolated into a shell command) in the generate step.
  workflow_dispatch:
    inputs:
      documents:
        # Default is 50000, not the 200k profile target: measured locally at
        # ~66 docs/sec indexing throughput (20k docs took ~306s end-to-end
        # against local compose Manticore), 200k would need ~50+ minutes,
        # over this job's 30-minute timeout. See
        # docs/runbooks/performance-evidence.md for the measurement and how
        # to raise this once indexing is faster or the timeout is raised.
        description: "Corpus document count"
        required: false
        default: "50000"
  push:
    branches:
      - main
    paths:
      - "benchmarks/**"
      - "packages/search/**"
      - "packages/domain/**"
      - "docker-compose.yml"
      - "tools/manticore/manticore.conf"
      - ".github/workflows/bench-search.yml"

permissions:
  contents: read

concurrency:
  group: bench-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Observe-only lane (RJC-344 / ADR-0003): runs 1-9 against any cohort are
    # measure-only, and a time gate needs >=20 homogeneous successful runs plus
    # an accepted absolute budget. BENCH_ALLOW_FAIL=1 keeps this workflow from
    # ever failing the run on an SLO breach — it must never be added to a
    # required-check list until that gate is deliberately flipped (see
    # docs/runbooks/performance-evidence.md).
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: "1.3.14"

      - name: Restore Bun dependency cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf  # v4.2.2
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      # A `services:` container starts before checkout, so its bind-mounted
      # tools/manticore/manticore.conf would resolve against an empty
      # directory and searchd would never become healthy. Starting Manticore
      # here (after checkout) via the same docker-compose.yml + healthcheck
      # used locally avoids that ordering bug.
      - name: Start Manticore
        run: docker compose --env-file .env.example up -d --wait manticore

      - name: Generate benchmark corpus
        env:
          BENCH_DOCUMENTS: ${{ inputs.documents || '50000' }}
        run: bun run bench:generate -- --documents "$BENCH_DOCUMENTS"

      - name: Run search benchmark against Manticore
        env:
          BENCH_ALLOW_FAIL: "1"
          BENCH_REQUIRE_MANTICORE: "1"
          MANTICORE_URL: http://127.0.0.1:9308
          PERF_METRICS_DIR: artifacts/perf
        run: bun run bench:search

      - name: Upload benchmark performance records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: bench-search-${{ github.run_id }}
          path: artifacts/perf
          if-no-files-found: warn
          retention-days: 14
