---
# Synthetic raw-object storage wiring for the opt-in remote Compose smoke.
#
# Keep this override separate from docker-compose.yml: local development keeps
# its filesystem fallback unless the smoke lane explicitly enables
# SMOKE_RAW_STORAGE=1, while the production startup guard remains unchanged.
services:
  server:
    environment:
      RAW_S3_BUCKET: ${RAW_S3_BUCKET:?RAW_S3_BUCKET is required for the smoke raw store}
      RAW_S3_ENDPOINT: ${RAW_S3_ENDPOINT:?RAW_S3_ENDPOINT is required for the smoke raw store}
      RAW_S3_REGION: ${RAW_S3_REGION:?RAW_S3_REGION is required for the smoke raw store}
      RAW_S3_ACCESS_KEY_ID: ${RAW_S3_ACCESS_KEY_ID:?RAW_S3_ACCESS_KEY_ID is required for the smoke raw store}
      RAW_S3_SECRET_ACCESS_KEY: ${RAW_S3_SECRET_ACCESS_KEY:?RAW_S3_SECRET_ACCESS_KEY is required for the smoke raw store}
