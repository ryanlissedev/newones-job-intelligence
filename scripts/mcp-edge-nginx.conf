worker_processes 1;

events {
  worker_connections 128;
}

http {
  map $http_x_request_id $edge_request_id {
    "" $request_id;
    default $http_x_request_id;
  }

  log_format edge_json escape=json
    '{"requestId":"$edge_request_id","status":$status,'
    '"upstream":"$upstream_addr","durationSeconds":$request_time,'
    '"upstreamDurationSeconds":"$upstream_response_time"}';
  access_log /var/log/nginx/access.log edge_json;

  upstream catapulze_servers {
    server server-a:3000;
    server server-b:3000;
  }

  server {
    listen 8080;

    location = /edge-health {
      access_log off;
      return 200 "ok\n";
    }

    location / {
      proxy_pass http://catapulze_servers;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host edge;
      proxy_set_header X-Request-Id $edge_request_id;
      proxy_next_upstream off;
      proxy_buffering off;
      add_header X-Request-Id $edge_request_id always;
      add_header X-Catapulze-Upstream $upstream_addr always;
    }
  }
}
