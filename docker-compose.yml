---
name: catapulze-job-intelligence

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    ports:
      - target: 5432
        published: "${POSTGRES_HOST_PORT:-5432}"
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:?POSTGRES_MIGRATOR_USER is required}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD is required}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./tools/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    cpus: "${POSTGRES_CPU_LIMIT:-2.0}"
    mem_limit: "${POSTGRES_MEMORY_LIMIT:-4g}"
    mem_reservation: "${POSTGRES_MEMORY_RESERVATION:-1g}"
    shm_size: "${POSTGRES_SHM_SIZE:-512m}"
    stop_grace_period: 1m
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
    init: true
    ports:
      - "3001:3001"
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      # Server-only: what the Next.js server process (dashboard SSR session
      # lookup) calls; the browser keeps using NEXT_PUBLIC_SERVER_URL below.
      INTERNAL_SERVER_URL: ${INTERNAL_SERVER_URL:-http://server:3000}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
      APP_RELEASE_SHA: ${APP_RELEASE_SHA:-}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - target: 6379
        published: "${REDIS_HOST_PORT:-6379}"
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    cpus: "0.5"
    mem_limit: 256m
    restart: unless-stopped

  manticore:
    image: manticoresearch/manticore:6.3.8
    ports:
      - target: 9308
        published: "${MANTICORE_HTTP_PORT:-9308}"
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 9306
        published: "${MANTICORE_MYSQL_PORT:-9306}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - manticore_data:/var/lib/manticore
      # Writable bind mount: the official entrypoint chowns /etc/manticoresearch before
      # dropping to the manticore user; :ro makes that chown fail and crash-loops searchd.
      - ./tools/manticore/manticore.conf:/etc/manticoresearch/manticore.conf
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql -h127.0.0.1 -P9306 -e 'SHOW TABLES' | grep -q aanvragen",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    cpus: "1.0"
    mem_limit: 1g
    restart: unless-stopped

  # RJC-382: shadow instance for evaluating Manticore 29.x (native hybrid
  # search — BM25+KNN with RRF fusion) against the pinned 6.3.8 production
  # instance above, side by side. Gated behind the "shadow" profile, so a
  # plain `docker compose up` (no profile) never starts it — only
  # `docker compose up -d manticore29` (explicitly targeting it activates
  # its profile) or `docker compose --profile shadow up -d` do. See
  # tools/manticore/README-29-shadow.md for the comparison plan. The
  # production `manticore` service above must stay byte-identical.
  manticore29:
    profiles: ["shadow"]
    image: manticoresearch/manticore:29.0.2@sha256:647ff5da4de6361eb043417a8f19b9e05041d3cfa1c3566665c07bc872cd15c3
    ports:
      - target: 9308
        published: "${MANTICORE29_HTTP_PORT:-9312}"
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 9306
        published: "${MANTICORE29_MYSQL_PORT:-9313}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - manticore29_data:/var/lib/manticore
      # Writable bind mount: same reason as the 6.3.8 service — the official
      # entrypoint chowns /etc/manticoresearch before dropping to the
      # manticore user; :ro makes that chown fail and crash-loops searchd.
      - ./tools/manticore/manticore29.conf:/etc/manticoresearch/manticore.conf
      - ./tools/manticore/wordforms-nl.txt:/etc/manticoresearch/wordforms-nl.txt
    healthcheck:
      # Table-independent on purpose (unlike the 6.3.8 healthcheck above,
      # which greps for the aanvragen table): this service starts with an
      # empty RT table set on a fresh volume — the probe script creates
      # aanvragen itself after startup — so a table-existence check would
      # never pass and `docker compose up -d --wait manticore29` would hang
      # until timeout. `SELECT 1` only proves searchd itself is answering.
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9306 -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    cpus: "1.0"
    mem_limit: 1g
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    ports:
      - "3000:3000"
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      APP_RELEASE_SHA: ${APP_RELEASE_SHA:-}
      DATABASE_URL: ${CATAPULZE_DATABASE_URL:?CATAPULZE_DATABASE_URL is required}
      MANTICORE_URL: ${MANTICORE_URL:-http://manticore:9308}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SEARCH_HYBRID: ${SEARCH_HYBRID:-0}
    depends_on:
      postgres:
        condition: service_healthy
      manticore:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/readyz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # RJC-386: local S3-compatible target for the durable raw object store.
  # Opt-in via `--profile storage` — never started by a plain `docker
  # compose up`, and never part of the app services above.
  #
  # Named distinctly from docker-compose.backup.yml's own `minio`/`minio-init`
  # (a separate, pre-existing WAL-G backup-drill overlay on port 9000): a
  # same-named service here would deep-merge with that overlay's definition
  # whenever both files are combined (its own documented usage is
  # `-f docker-compose.yml -f docker-compose.backup.yml`), silently changing
  # an already-working, unrelated feature. Kept fully independent instead.
  raw-storage-minio:
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    profiles: ["storage"]
    # Runs as root so MinIO can write the Docker-created named volume; local/CI
    # fixture only (production raw storage is R2).
    user: "0:0"
    command: server /data --console-address ":9001"
    ports:
      - target: 9000
        published: "${RAW_STORAGE_MINIO_API_PORT:-9002}"
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 9001
        published: "${RAW_STORAGE_MINIO_CONSOLE_PORT:-9003}"
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      # ponytail: well-known local-only MinIO defaults, never used against a
      # real bucket — see apps/server/.env.example and apps/worker/.env.example.
      MINIO_ROOT_USER: ${RAW_STORAGE_MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${RAW_STORAGE_MINIO_ROOT_PASSWORD:-minioadmin}
      # Lets the `mc ready local` healthcheck resolve alias `local` without a
      # config file (the chainguard image ships mc but no curl).
      MC_HOST_local: http://${RAW_STORAGE_MINIO_ROOT_USER:-minioadmin}:${RAW_STORAGE_MINIO_ROOT_PASSWORD:-minioadmin}@127.0.0.1:9000
    volumes:
      - raw_storage_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # RJC-387: on-box search projector, standing in locally for the process
  # that runs next to Manticore in production (docs/runbooks/search-projector.md).
  # Opt-in via `--profile projector` — never started by a plain `docker
  # compose up`. Talks to the same postgres/manticore services above, over
  # the compose network rather than TLS/loopback like production.
  projector:
    build:
      context: .
      dockerfile: apps/server/Dockerfile.projector
    profiles: ["projector"]
    init: true
    command: ["bun", "run", "projector"]
    environment:
      APP_RELEASE_SHA: ${APP_RELEASE_SHA:-}
      DATABASE_URL: ${CATAPULZE_DATABASE_URL:?CATAPULZE_DATABASE_URL is required}
      # Override together with SEARCH_HYBRID when deliberately targeting the
      # already-started, healthy shadow service (http://manticore29:9308).
      MANTICORE_URL: ${MANTICORE_URL:-http://manticore:9308}
      SEARCH_HYBRID: ${SEARCH_HYBRID:-0}
      # Local Compose uses the same direct Postgres service for data and lock.
      # Production must override this when CATAPULZE_DATABASE_URL is pooled;
      # the projector's typed env rejects a known Neon pooler host here.
      PROJECTOR_DATABASE_URL: ${PROJECTOR_DATABASE_URL:-${CATAPULZE_DATABASE_URL:?CATAPULZE_DATABASE_URL is required}}
    depends_on:
      postgres:
        condition: service_healthy
      manticore:
        condition: service_healthy
    # The projector is a long-running worker and does not serve the API
    # image's inherited /readyz endpoint on port 3000.
    healthcheck:
      disable: true
    restart: unless-stopped

  poller:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile.poller
    profiles: ["poller"]
    init: true
    environment:
      APP_RELEASE_SHA: ${APP_RELEASE_SHA:-}
      DATABASE_URL: ${CATAPULZE_DATABASE_URL:?CATAPULZE_DATABASE_URL is required}
      # Local Compose uses the same direct Postgres service for data and lock.
      # Production must override this when CATAPULZE_DATABASE_URL is pooled;
      # the poller's typed env rejects a known Neon pooler host here.
      POLLER_DATABASE_URL: ${POLLER_DATABASE_URL:-${CATAPULZE_DATABASE_URL:?CATAPULZE_DATABASE_URL is required}}
      POLLER_TICK_MS: ${POLLER_TICK_MS:-60000}
      POLLER_CURATE_BUDGET_MS: ${POLLER_CURATE_BUDGET_MS:-120000}
      # Sources polled side by side per cycle. Politeness per host is unchanged:
      # crawl_delay_ms still paces requests inside one source. Also the ceiling
      # on concurrent curate drains against Postgres, one per source in flight.
      POLLER_CONCURRENCY: ${POLLER_CONCURRENCY:-2}
      # A scrape run still `running` after this is failed at the top of a cycle;
      # a process killed mid-run would otherwise leave the row running forever.
      POLLER_ABANDON_RUN_AFTER_MS: ${POLLER_ABANDON_RUN_AFTER_MS:-21600000}
      RAW_S3_BUCKET: ${RAW_S3_BUCKET:-}
      RAW_S3_ENDPOINT: ${RAW_S3_ENDPOINT:-}
      RAW_S3_REGION: ${RAW_S3_REGION:-}
      RAW_S3_ACCESS_KEY_ID: ${RAW_S3_ACCESS_KEY_ID:-}
      RAW_S3_SECRET_ACCESS_KEY: ${RAW_S3_SECRET_ACCESS_KEY:-}
      # CTP-602 per-source egress routing (docs/runbooks/nl-egress.md). Both
      # unset is direct egress for every source; sources without a URL fails
      # the poller at startup rather than polling direct silently.
      EGRESS_PROXY_URL: ${EGRESS_PROXY_URL:-}
      EGRESS_PROXY_SOURCES: ${EGRESS_PROXY_SOURCES:-}
      # Per-bron live flags (packages/application/src/sources/*.ts `liveEnv`).
      # Unset means the connector reads a repo fixture; with NODE_ENV=production
      # the poller skips those sources rather than committing fixture data.
      ALLIANDER_LIVE: ${ALLIANDER_LIVE:-}
      ASML_LIVE: ${ASML_LIVE:-}
      BAM_LIVE: ${BAM_LIVE:-}
      BIJORANJE_LIVE: ${BIJORANJE_LIVE:-}
      BLUETRAIL_LIVE: ${BLUETRAIL_LIVE:-}
      CTM_LIVE: ${CTM_LIVE:-}
      DATAJOBS_LIVE: ${DATAJOBS_LIVE:-}
      ENECO_LIVE: ${ENECO_LIVE:-}
      ENEXIS_LIVE: ${ENEXIS_LIVE:-}
      ESSENT_LIVE: ${ESSENT_LIVE:-}
      FLINTER_LIVE: ${FLINTER_LIVE:-}
      FREELANCER_NL_LIVE: ${FREELANCER_NL_LIVE:-}
      GASUNIE_LIVE: ${GASUNIE_LIVE:-}
      HARVEYNASH_LIVE: ${HARVEYNASH_LIVE:-}
      HAYS_LIVE: ${HAYS_LIVE:-}
      HEIJMANS_LIVE: ${HEIJMANS_LIVE:-}
      HERO_LIVE: ${HERO_LIVE:-}
      INHUURDESK_LIVE: ${INHUURDESK_LIVE:-}
      INTERMEDIAIR_LIVE: ${INTERMEDIAIR_LIVE:-}
      JOBBIRD_LIVE: ${JOBBIRD_LIVE:-}
      NEEDSTAFFING_LIVE: ${NEEDSTAFFING_LIVE:-}
      NS_LIVE: ${NS_LIVE:-}
      ONEFELLOW_LIVE: ${ONEFELLOW_LIVE:-}
      OPDRACHTOVERHEID_LIVE: ${OPDRACHTOVERHEID_LIVE:-}
      PLANET_INTERIM_LIVE: ${PLANET_INTERIM_LIVE:-}
      PROACT_LIVE: ${PROACT_LIVE:-}
      PRORAIL_LIVE: ${PRORAIL_LIVE:-}
      RABOBANK_LIVE: ${RABOBANK_LIVE:-}
      RANDSTAD_LIVE: ${RANDSTAD_LIVE:-}
      RIJKSWATERSTAAT_LIVE: ${RIJKSWATERSTAAT_LIVE:-}
      STEDIN_LIVE: ${STEDIN_LIVE:-}
      STRIIVE_LIVE: ${STRIIVE_LIVE:-}
      TBI_LIVE: ${TBI_LIVE:-}
      TECHNIEKWERKT_LIVE: ${TECHNIEKWERKT_LIVE:-}
      TENDER_NED_LIVE: ${TENDER_NED_LIVE:-}
      TENMONKS_LIVE: ${TENMONKS_LIVE:-}
      TENNET_LIVE: ${TENNET_LIVE:-}
      UNICA_LIVE: ${UNICA_LIVE:-}
      VATTENFALL_LIVE: ${VATTENFALL_LIVE:-}
      VOLKERWESSELS_LIVE: ${VOLKERWESSELS_LIVE:-}
      WERKEN_VOOR_NEDERLAND_LIVE: ${WERKEN_VOOR_NEDERLAND_LIVE:-}
      WERK_NL_LIVE: ${WERK_NL_LIVE:-}
      ZZP_OPDRACHTEN_LIVE: ${ZZP_OPDRACHTEN_LIVE:-}
    depends_on:
      postgres:
        condition: service_healthy
    # Shutdown finishes the source in flight, so the stop timeout must cover one
    # poll plus one curation pass. Same budget as the heartbeat allowance in
    # apps/worker/src/poller/heartbeat.ts; below it Docker escalates to SIGKILL
    # and the advisory lock stays held until Postgres reaps the connection.
    stop_grace_period: 300s
    restart: unless-stopped

  # One-shot bucket bootstrap: creates the configured local bucket and exits.
  # Re-running `up --profile storage` is idempotent (`mc mb --ignore-existing`).
  raw-storage-minio-init:
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    profiles: ["storage"]
    depends_on:
      raw-storage-minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${RAW_STORAGE_MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${RAW_STORAGE_MINIO_ROOT_PASSWORD:-minioadmin}
      RAW_S3_BUCKET: ${RAW_S3_BUCKET:-ji-raw-local}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://raw-storage-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$RAW_S3_BUCKET"
    restart: "no"

volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_DATA_VOLUME:-catapulze-postgres-p0}
  raw_storage_minio_data:
  manticore_data:
  manticore29_data:
