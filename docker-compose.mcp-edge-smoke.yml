---
# RJC-448: two production server images behind a stateless round-robin edge.
x-mcp-edge-server: &mcp-edge-server
  build:
    context: .
    dockerfile: apps/server/Dockerfile
  image: ${COMPOSE_PROJECT_NAME}-mcp-server:${MCP_EDGE_SOURCE_SHA}
  init: true
  env_file: !reset []
  environment:
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    BETTER_AUTH_URL: http://edge:8080
    CORS_ORIGIN: http://edge:8080
    APP_RELEASE_SHA: ${MCP_EDGE_SOURCE_SHA}
    DATABASE_URL: ${CATAPULZE_DATABASE_URL}
    MANTICORE_URL: ${MANTICORE_URL}
    REDIS_URL: ${REDIS_URL}
    SEARCH_HYBRID: ${SEARCH_HYBRID}
    RAW_S3_BUCKET: ji-raw-local
    RAW_S3_ENDPOINT: http://raw-storage-minio:9000
    RAW_S3_REGION: us-east-1
    RAW_S3_ACCESS_KEY_ID: ${RAW_STORAGE_MINIO_ROOT_USER}
    RAW_S3_SECRET_ACCESS_KEY: ${RAW_STORAGE_MINIO_ROOT_PASSWORD}
  depends_on:
    postgres:
      condition: service_healthy
    manticore:
      condition: service_healthy
    redis:
      condition: service_healthy
    raw-storage-minio-init:
      condition: service_completed_successfully
  healthcheck:
    test:
      [
        "CMD",
        "bun",
        "-e",
        "fetch('http://localhost:3000/readyz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
      ]
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 10s
  restart: "no"

services:
  server:
    ports: !reset []
    env_file: !reset []

  web:
    ports: !reset []
    env_file: !reset []

  postgres:
    ports: !reset []
    restart: "no"

  redis:
    ports: !reset []
    restart: "no"

  manticore:
    ports: !reset []
    restart: "no"

  raw-storage-minio:
    ports: !reset []
    restart: "no"

  raw-storage-minio-init:
    restart: "no"

  migrator:
    build:
      context: .
      dockerfile: apps/server/Dockerfile.migrate
    profiles: ["mcp-edge"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_MIGRATOR_USER}:${POSTGRES_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}
    # The image CMD parks the container after a successful migrate so Coolify's
    # restart=unless-stopped stops looping it; the smoke must exit after migrating.
    command: ["bun", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  projector:
    healthcheck:
      disable: false
      test: ["CMD", "bun", "src/projector/heartbeat.ts", "--check"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: "no"

  server-a:
    <<: *mcp-edge-server

  server-b:
    <<: *mcp-edge-server

  edge:
    image: nginx:1.29.1-alpine@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    ports: !reset []
    volumes:
      - ./scripts/mcp-edge-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      server-a:
        condition: service_healthy
      server-b:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/edge-health",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: "no"

volumes:
  postgres_data:
    external: false
    name: ${COMPOSE_PROJECT_NAME}_postgres_data
  raw_storage_minio_data:
    external: false
    name: ${COMPOSE_PROJECT_NAME}_raw_storage_minio_data
  manticore_data:
    external: false
    name: ${COMPOSE_PROJECT_NAME}_manticore_data
