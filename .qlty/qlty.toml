# Qlty project config — cross-language smells, secrets, shell/workflow lint.
# TS/JS lint + format: Ultracite (Oxlint/Oxfmt + anti-slop) via `bun run fix|check`.
# Never run `qlty githooks install`; Lefthook is the sole `.git/hooks` owner.
# Never invoke `qlty fmt`; every `qlty check` uses `--no-formatters`.

config_version = "0"

exclude_patterns = [
  "**/node_modules/**",
  "**/.turbo/**",
  "**/dist/**",
  "**/build/**",
  "**/coverage/**",
  "docs/**",
  "openwiki/**",
  ".cache/**",
  "tools/oxlint/anti-slop/**",
]

test_patterns = ["**/*.spec.ts", "**/*.test.ts", "**/test/**", "**/tests/**"]

[[source]]
name = "default"
default = true

# --- Enabled plugins (no formatters) ---

[[plugin]]
name = "actionlint"
affects_cache = [".github/actionlint.yaml"]

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "yamllint"

[[plugin]]
name = "ripgrep"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "trufflehog"
version = "3.82.12"
drivers = ["lint-local-dev"]

# TruffleHog 3.82.12 re-execs through Overseer even with --no-update. The
# project-local driver keeps the same verified-secret policy while bypassing
# that crash-prone supervisor path on macOS.
[plugins.definitions.trufflehog.drivers.lint-local-dev]
script = "trufflehog --local-dev filesystem --json --fail --only-verified --no-update --user-agent-suffix=qlty ${target}"
success_codes = [0, 183]
output = "stdout"
output_format = "trufflehog"
cache_results = true
batch = true
suggested = "targets"
output_missing = "parse"

[[plugin]]
name = "checkov"

# --- Tombstones: disabled plugins with reasons ---

# Ultracite oxlint.config.ts owns TS/JS lint (pins Oxlint 1.80, jsPlugins anti-slop).
[[plugin]]
name = "oxc"
mode = "disabled"

# Oxfmt via Ultracite owns formatting; belt-and-braces with --no-formatters on every check.
[[plugin]]
name = "prettier"
mode = "disabled"

# ESLint overlaps Ultracite/Oxlint; no dual TS lint path in v1.
[[plugin]]
name = "eslint"
mode = "disabled"

# Biome overlaps Ultracite/Oxlint + Oxfmt.
[[plugin]]
name = "biome"
mode = "disabled"

# Product discovery docs in docs/ are not Markdown-lint targets.
[[plugin]]
name = "markdownlint"
mode = "disabled"

# Shell formatters conflict with scoped Ultracite/Oxfmt ownership.
[[plugin]]
name = "shfmt"
mode = "disabled"
